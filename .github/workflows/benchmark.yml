name: Benchmark CI

# Fast synthetic subset only. Does not call the Quality GPU worker.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  score-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio2score-week4/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MIDI-only dependencies
        run: pip install -r requirements-score.txt
      - name: Source identity and independent reference-MIDI gates
        run: |
          python -m pytest -q tests/test_performance_foundation.py \
            tests/test_performance_score.py tests/test_performance_cli.py \
            tests/test_quantizer_identity.py tests/test_score_ab.py \
            tests/test_export_integrity.py -m "not audio and not integration and not pm2s"

  midi-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio2score-week4/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx
      - name: Notation / hands / voices / MIDI ingest tests
        run: |
          python -m pytest -q \
            tests/test_regression_benchmark.py \
            tests/test_canonical_benchmark.py \
            tests/test_hand_separator.py \
            tests/test_voice_preservation.py \
            tests/test_notation_plan_production.py \
            tests/test_midi_ingest.py \
            tests/test_meter_quantizer.py \
            tests/test_correction_semantics.py \
            tests/test_notation_http_stability.py \
            tests/test_readable_v2_cases.py \
            tests/test_shared_engraving.py \
            tests/test_voice_separator.py \
            tests/test_notation_articulation_ownership.py \
            tests/test_notation_evidence_meter.py \
            tests/test_export_integrity.py \
            tests/test_export_integrity_audio.py
      - name: MIDI benchmark subset
        run: python -m benchmark.runner --mode midi --subset ci

  frontend-notation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio2score-week4/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: audio2score-week4/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend editor and PDF export tests
        run: npm test
