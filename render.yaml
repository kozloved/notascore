# Blueprint for the CPU site on Render. GPU (YourMT3) stays on Vast.ai.
#
# Dashboard: New → Blueprint → this repo. File must live at the repo root.
# Docs: audio2score-week4/deploy/RENDER.md

services:
  - type: keyvalue
    name: notascore-redis
    plan: starter
    maxmemoryPolicy: noeviction

  - type: web
    name: notascore-backend
    runtime: docker
    plan: standard
    dockerfilePath: ./audio2score-week4/backend/Dockerfile
    dockerContext: ./audio2score-week4/backend
    dockerCommand: ./start-web.sh
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    disk:
      name: notascore-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/audio2score.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: RESULTS_DIR
        value: /data/results
      - key: TEMP_DIR
        value: /data/tmp
      - key: QUEUE_NAME
        value: transcription
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: TRANSCRIPTION_PIPELINE
        value: understanding
      - key: TRANSCRIPTION_PIPELINE_FALLBACK
        value: "1"
      - key: TRANSCRIPTION_BACKEND
        value: basic_pitch
      - key: TRANSCRIPTION_USE_CLEANER
        value: "1"
      - key: TRANSCRIPTION_USE_NORMALIZER
        value: "1"
      - key: TRANSCRIPTION_USE_BEAT_TRACKER
        value: "1"
      - key: TRANSCRIPTION_USE_PIANO_ANALYZER
        value: "1"
      - key: TRANSCRIPTION_USE_MIR_LAYERS
        value: "1"
      - key: MT3_MODEL
        value: yourmt3
      - key: MT3_TIMEOUT_SECONDS
        value: "300"
      - key: REDIS_URL
        fromService:
          name: notascore-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_PUBLIC_URL
        fromService:
          name: notascore-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGIN
        value: https://notascore.com,https://www.notascore.com
      - key: MT3_ENDPOINT
        sync: false
      - key: MT3_API_KEY
        sync: false

  - type: web
    name: notascore-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./audio2score-week4/frontend/Dockerfile
    dockerContext: ./audio2score-week4/frontend
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: BACKEND_URL
        fromService:
          name: notascore-backend
          type: web
          property: hostport
