# CPU stack for Railway (no GPU).
#
# Drag this file onto a Railway project canvas to import services, or follow
# audio2score-week4/deploy/RAILWAY.md and create the services from GitHub.
#
# Do NOT put the YourMT3 GPU worker here. Set MT3_ENDPOINT to the Vast.ai URL.

services:
  backend:
    build:
      context: ./backend
    command: ["./start-railway.sh"]
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data
    environment:
      PORT: "8000"
      DATABASE_URL: sqlite:////data/audio2score.db
      UPLOAD_DIR: /data/uploads
      RESULTS_DIR: /data/results
      TEMP_DIR: /data/tmp
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_NAME: transcription
      CORS_ORIGIN: ${CORS_ORIGIN:-https://notascore.com}
      MAX_UPLOAD_MB: "25"
      TRANSCRIPTION_PIPELINE: understanding
      TRANSCRIPTION_PIPELINE_FALLBACK: "1"
      TRANSCRIPTION_BACKEND: basic_pitch
      TRANSCRIPTION_USE_CLEANER: "1"
      TRANSCRIPTION_USE_NORMALIZER: "1"
      TRANSCRIPTION_USE_BEAT_TRACKER: "1"
      TRANSCRIPTION_USE_PIANO_ANALYZER: "1"
      TRANSCRIPTION_USE_MIR_LAYERS: "1"
      MT3_ENDPOINT: ${MT3_ENDPOINT:-}
      MT3_API_KEY: ${MT3_API_KEY:-}
      MT3_MODEL: ${MT3_MODEL:-yourmt3}
      MT3_TIMEOUT_SECONDS: "300"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "::"
      BACKEND_URL: http://backend.railway.internal:8000
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend

volumes:
  backend-data:
