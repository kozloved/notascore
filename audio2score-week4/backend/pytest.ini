[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: live checks that need MT3_ENDPOINT and MT3_API_KEY
    pm2s: live PM2S model tests (torch + Zenodo weights)
    audio: needs the full transcription/audio stack, not MIDI-only requirements
    app: needs the FastAPI app stack (dotenv, main), not MIDI-only requirements
