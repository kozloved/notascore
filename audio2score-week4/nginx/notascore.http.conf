# HTTP-only origin for Cloudflare Tunnel (and local port 80 checks).
# start-local-tunnel.sh copies this file to notascore.conf.

# Only send Connection: upgrade when the client actually asked for a websocket.
# A hardcoded Connection: upgrade on every request makes Node/Next.js reset
# the socket, which Cloudflare surfaces as a 502 Host Error.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend_upstream {
    server frontend:3000;
}

upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name notascore.com www.notascore.com;

    client_max_body_size 30m;

    # Fail fast so Cloudflare does not wait on a dead container.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Browser calls /api/upload → FastAPI /upload
    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api {
        return 301 /api/;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
