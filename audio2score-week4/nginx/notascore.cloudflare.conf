# Origin config for Cloudflare Tunnel (recommended) or Cloudflare proxy → :80.
# TLS terminates at Cloudflare; this container speaks plain HTTP on port 80.

upstream frontend_upstream {
    server frontend:3000;
}

upstream api_upstream {
    server api:8000;
}

map $http_x_forwarded_proto $notascore_proto {
    default $scheme;
    https   https;
    http    http;
}

map $http_cf_connecting_ip $notascore_client_ip {
    default $remote_addr;
    ~.+     $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name notascore.com www.notascore.com;

    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $notascore_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $notascore_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api {
        return 301 /api/;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $notascore_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $notascore_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
