services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - notascore
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
      TEMP_DIR: /app/.tmp
      DATABASE_URL: sqlite:////app/data/audio2score.db
    volumes:
      - uploads:/app/uploads
      - results:/app/results
      - tmpdata:/app/.tmp
      - dbdata:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - notascore
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "worker.py"]
    # Basic Pitch can eat several GB. Cap it so the worker cannot OOM
    # Docker Desktop and take down nginx/cloudflared (Cloudflare 502).
    mem_limit: 4g
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
      TEMP_DIR: /app/.tmp
      DATABASE_URL: sqlite:////app/data/audio2score.db
    volumes:
      - uploads:/app/uploads
      - results:/app/results
      - tmpdata:/app/.tmp
      - dbdata:/app/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - notascore

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://notascore.com/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    # Docker overwrites HOSTNAME with the container id; force the listen address.
    command: ["sh", "-c", "HOSTNAME=0.0.0.0 exec node server.js"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - notascore

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/notascore.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - notascore

  # Cloudflare Tunnel: exposes notascore.com without opening router ports.
  # Dashboard public hostname service URL must be http://nginx:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # http2 is more reliable than QUIC on some home NATs (QUIC flaps → 502).
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    env_file:
      - .env.production
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - notascore
    profiles:
      - tunnel

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
    profiles:
      - certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  uploads:
  results:
  tmpdata:
  dbdata:
  certbot-www:
  certbot-etc:

networks:
  notascore:
    driver: bridge
