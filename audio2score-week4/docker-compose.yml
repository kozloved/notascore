x-nextgen-env: &nextgen-env
  # Service `env_file` alone has been observed not to inject NEXTGEN_* on the
  # VPS. These keys must live under `environment:` so
  # `docker compose --env-file .env.production` interpolates them into api/worker.
  NEXTGEN_PIPELINE_MODE: ${NEXTGEN_PIPELINE_MODE:-legacy}
  NEXTGEN_SEPARATION_ENABLED: ${NEXTGEN_SEPARATION_ENABLED:-0}
  NEXTGEN_SEPARATION_BACKEND: ${NEXTGEN_SEPARATION_BACKEND:-auto}
  SEPARATION_ENDPOINT: ${SEPARATION_ENDPOINT:-}
  NEXTGEN_STEM_TRANSCRIPTION_ENABLED: ${NEXTGEN_STEM_TRANSCRIPTION_ENABLED:-0}
  NEXTGEN_FUSION_ENABLED: ${NEXTGEN_FUSION_ENABLED:-0}
  NEXTGEN_TRANSKUN: ${NEXTGEN_TRANSKUN:-0}
  NEXTGEN_BEAT_THIS: ${NEXTGEN_BEAT_THIS:-0}
  NEXTGEN_ENSEMBLE_RENDER: ${NEXTGEN_ENSEMBLE_RENDER:-0}
  NEXTGEN_WRITE_MANIFEST: ${NEXTGEN_WRITE_MANIFEST:-1}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - notascore
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      <<: *nextgen-env
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
      TEMP_DIR: /app/.tmp
      DATABASE_URL: sqlite:////app/data/audio2score.db
    volumes:
      - uploads:/app/uploads
      - results:/app/results
      - tmpdata:/app/.tmp
      - dbdata:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - notascore
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file:
      - .env.production
    environment:
      <<: *nextgen-env
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
      TEMP_DIR: /app/.tmp
      DATABASE_URL: sqlite:////app/data/audio2score.db
    volumes:
      - uploads:/app/uploads
      - results:/app/results
      - tmpdata:/app/.tmp
      - dbdata:/app/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - notascore

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    networks:
      - notascore

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Localhost only. Cloudflare Tunnel reaches nginx on the Docker network.
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/notascore.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - notascore

  # Optional local GPU worker. Remote Vast.ai does not use this profile —
  # set MT3_ENDPOINT on api/worker instead. Requires nvidia-container-toolkit.
  gpu-worker:
    profiles: ["gpu"]
    build:
      context: ./gpu-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MT3_MODEL: ${MT3_MODEL:-yourmt3}
      MT3_API_KEY: ${MT3_API_KEY:-}
      MT3_WARMUP: "1"
      PORT: "8090"
    ports:
      - "8090:8090"
    gpus: all
    networks:
      - notascore

  # Cloudflare Tunnel: exposes notascore.com without opening router ports.
  # Dashboard public hostname service URL must be http://nginx:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # http2 avoids flaky QUIC/UDP timeouts on Docker Desktop / some networks
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    env_file:
      - .env.production
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - notascore
    profiles:
      - tunnel

volumes:
  uploads:
  results:
  tmpdata:
  dbdata:

networks:
  notascore:
    driver: bridge
